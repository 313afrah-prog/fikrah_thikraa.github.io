<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة فكرة وذكرى | Fikrah & Thikraa Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #d4a3b1;
      --primary-dark: #b88292;
      --bg: #faf6f8;
      --card: #ffffff;
      --text: #4a3e43;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 24px;
      border: 1px solid #f0e6eb;
    }
    h1, h2, h3 { color: #5a4b51; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    input[type="text"], input[type="number"], input[type="email"], input[type="password"], textarea, select {
      width: 100%; padding: 12px; border: 1px solid #e2d8dd; border-radius: 10px; box-sizing: border-box; font-size: 14px;
      outline: none; transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    button {
      background: var(--primary); color: white; border: none; padding: 12px 24px;
      border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; transition: background 0.2s;
    }
    button:hover { background: var(--primary-dark); }
    .hidden { display: none; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-box { background: #fdfafd; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid #f2e8ed; }
    .stat-number { font-size: 24px; font-weight: bold; color: var(--primary-dark); }
  </style>
</head>
<body>

  <div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="card" style="max-width: 420px; margin: 60px auto;">
      <h2 style="text-align: center; color: var(--primary-dark);">فكرة وذكرى | لوحة الإدارة</h2>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" value="313afrah@gmail.com">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="hidden">
      <h1>📊 لوحة تحكم «فكرة وذكرى»</h1>
      
      <!-- إحصائيات -->
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-number" id="count-products">0</div><div>إجمالي المنتجات</div></div>
        <div class="stat-box"><div class="stat-number" id="count-portfolio">0</div><div>معرض الأعمال</div></div>
        <div class="stat-box"><div class="stat-number" id="count-services">0</div><div>الخدمات</div></div>
        <div class="stat-box"><div class="stat-number" id="count-certs">0</div><div>الشهادات</div></div>
      </div>

      <!-- إضافة منتج جديد -->
      <div class="card">
        <h3>🛍️ إضافة منتج جديد / صورة متجر</h3>
        <div class="form-group">
          <label>اسم المنتج (عربي)</label>
          <input type="text" id="prod-title-ar" placeholder="مثال: توزيعات أكريليك">
        </div>
        <div class="form-group">
          <label>اسم المنتج (إنجليزي)</label>
          <input type="text" id="prod-title-en" placeholder="Acrylic Giveaways">
        </div>
        <div class="form-group">
          <label>السعر (ر.ع)</label>
          <input type="number" step="0.1" id="prod-price" placeholder="مثال: 15.5">
        </div>
        <div class="form-group">
          <label>صورة المنتج</label>
          <input type="file" id="prod-image" accept="image/*">
        </div>
        <button onclick="uploadProduct()">حفظ ونشر المادة</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://qctzirzevpjwtysuzhck.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XHYgITZk2T_UfbBAxCkuSA_80APJQh9";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        alert("خطأ في تسجيل الدخول: " + error.message);
      } else {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadStats();
      }
    }

    async function loadStats() {
      const { count: pCount } = await db.from('products').select('*', { count: 'exact', head: true });
      const { count: poCount } = await db.from('portfolio').select('*', { count: 'exact', head: true });
      const { count: sCount } = await db.from('services').select('*', { count: 'exact', head: true });
      const { count: cCount } = await db.from('certificates').select('*', { count: 'exact', head: true });

      document.getElementById('count-products').innerText = pCount || 0;
      document.getElementById('count-portfolio').innerText = poCount || 0;
      document.getElementById('count-services').innerText = sCount || 0;
      document.getElementById('count-certs').innerText = cCount || 0;
    }

    async function uploadProduct() {
      const titleAr = document.getElementById('prod-title-ar').value;
      const titleEn = document.getElementById('prod-title-en').value;
      const price = document.getElementById('prod-price').value;
      const fileInput = document.getElementById('prod-image');
      const file = fileInput.files[0];

      if (!titleAr || !file) {
        alert("يرجى كتابة الاسم واختيار الصورة");
        return;
      }

      const fileName = `${Date.now()}_${file.name}`;
      const { data: uploadData, error: uploadError } = await db.storage.from('media').upload(fileName, file);

      if (uploadError) {
        alert("خطأ أثناء رفع الصورة: " + uploadError.message);
        return;
      }

      const imageUrl = `${SUPABASE_URL}/storage/v1/object/public/media/${fileName}`;

      const { error: insertError } = await db.from('products').insert([
        { title_ar: titleAr, title_en: titleEn, price: parseFloat(price) || 0, image_url: imageUrl }
      ]);

      if (insertError) {
        alert("خطأ أثناء حفظ البيانات: " + insertError.message);
      } else {
        alert("تم رفع الصورة وحفظ المنتج بنجاح!");
        document.getElementById('prod-title-ar').value = '';
        document.getElementById('prod-title-en').value = '';
        document.getElementById('prod-price').value = '';
        fileInput.value = '';
        loadStats();
      }
    }
  </script>
</body>
</html>
